{% extends "base.html" %}
{% block title %}Set up admin &middot; Cloud Push Server{% endblock %}
{% block content %}
<div class="login-card">
  <div class="login-head">
    <img class="login-icon" src="{{ url_for('static', filename='icon.svg') }}" alt="" width="46" height="46">
    <h1>Set up admin</h1>
  </div>
  <p class="lede">This server has no admin yet. Create the first admin account to continue.</p>
  {% if error %}<p class="lede" style="color: var(--danger)">{{ error }}</p>{% endif %}
  <form method="POST" action="/setup">
    <label for="username">Username</label>
    <div class="field">
      <input type="text" id="username" name="username" autocomplete="username" autofocus required>
    </div>
    <label for="password">Password</label>
    <div class="field">
      <input type="password" id="password" name="password" autocomplete="new-password" required>
    </div>
    <button type="submit" class="btn-primary">Create admin</button>
  </form>
</div>
{% endblock %}
