<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}Cloud Push Server{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body class="{{ '' if logged_in else 'no-nav' }}">
  {% if logged_in %}
  <aside class="side">
    <a class="brand" href="/pushes">
      <img class="brand-icon" src="{{ url_for('static', filename='icon.svg') }}" alt="" width="34" height="34">
      <span class="brand-text"><b>MDRender</b><span>Cloud Push</span></span>
    </a>
    <nav>
      <a href="/pair" class="{{ 'active' if request.path.startswith('/pair') else '' }}">Pair</a>
      <a href="/devices" class="{{ 'active' if request.path.startswith('/devices') else '' }}">Devices</a>
      <a href="/clients" class="{{ 'active' if request.path.startswith('/clients') else '' }}">Clients</a>
      <a href="/pushes" class="{{ 'active' if request.path.startswith('/pushes') else '' }}">Pushes</a>
      <a href="/pending" class="{{ 'active' if request.path.startswith('/pending') else '' }}">Pending</a>
    </nav>
    <form method="POST" action="/logout" class="logout">
      <button type="submit">Log out</button>
    </form>
  </aside>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>

  <dialog id="confirm-dialog" class="confirm">
    <form method="dialog">
      <h2>Please confirm</h2>
      <p id="confirm-message"></p>
      <div class="confirm-actions">
        <button value="cancel">Cancel</button>
        <button id="confirm-ok" value="confirm" class="btn-danger">Confirm</button>
      </div>
    </form>
  </dialog>
</body>
</html>
