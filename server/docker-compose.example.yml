services:
  push:
    build: .
    ports: ["8080:8080"]
    environment:
      SERVER_PASSWORD: "change-me"
      PUSH_PUBLIC_URL: "http://localhost:8080"
      FCM_SERVER_KEY: "/srv/fcm-service-account.json"
      LISTEN_ADDR: "0.0.0.0:8080"
    volumes:
      - ./data:/data/push
      - ./fcm-service-account.json:/srv/fcm-service-account.json:ro
